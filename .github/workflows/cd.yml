name: CD

# Deploys main to Azure Container Apps after CI has passed on it.
# Nothing runs until the Azure repository variables below are configured
# (see infra/README.md), so forks and fresh clones stay green.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC login to Azure, no long-lived secrets

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: logisticdesk-api

jobs:
  deploy:
    if: >-
      vars.AZURE_CLIENT_ID != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        id: image
        run: |
          set -euo pipefail
          az acr login --name "${{ vars.AZURE_ACR_NAME }}"
          login_server=$(az acr show --name "${{ vars.AZURE_ACR_NAME }}" --query loginServer -o tsv)
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          image="$login_server/$IMAGE_NAME:$sha"
          docker build -t "$image" -t "$login_server/$IMAGE_NAME:latest" .
          docker push "$image"
          docker push "$login_server/$IMAGE_NAME:latest"
          echo "ref=$image" >> "$GITHUB_OUTPUT"

      - name: Roll out new revision
        id: rollout
        run: |
          set -euo pipefail
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.image.outputs.ref }}"
          fqdn=$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          # The app may be scaled to zero, so give it time to cold start and migrate.
          for i in $(seq 1 30); do
            if curl -fsS "${{ steps.rollout.outputs.url }}/health/ready"; then
              echo; echo "Deployed: ${{ steps.rollout.outputs.url }}"; exit 0
            fi
            sleep 10
          done
          echo "Health check did not pass in time" >&2
          exit 1
