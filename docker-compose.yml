services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: logisticdesk
      MYSQL_USER: logistic
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-logistic_dev_pw}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pw}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Database__MigrateOnStartup: "true"
      # Local development key only. Real deployments get a generated secret (see infra/).
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-dev-only-signing-key-change-me-0123456789}
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=logisticdesk;User=logistic;Password=${MYSQL_PASSWORD:-logistic_dev_pw};"
    ports:
      - "8080:8080"

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "3000:8080"

volumes:
  db-data:
